name: Publish MCP Registry package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# One run per tag: a tag push and a manual dispatch for the same ref queue
# instead of publishing side by side (pre-release audit, 2026-10-30).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    name: OCI image + registry publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag and package versions
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$RELEASE_REF_TYPE" != "tag" ] || [[ "$RELEASE_TAG" != v* ]]; then
            echo "Select a v* tag for workflow_dispatch; branch publishing is refused" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          python3 scripts/check_versions.py "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/vladimir-human/ru-marketplace-mcp
          tags: |
            type=match,pattern=v(.*),group=1

      - name: Build the stdio image locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.stdio
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # This is the acceptance gate for the exact artifact the registry will
      # advertise: initialize / tools/list / tools/call over a real
      # `docker run --rm -i` BEFORE pushing to GHCR.
      - name: Real MCP session over docker stdio
        env:
          MCP_DOCKER_IMAGE: ghcr.io/vladimir-human/ru-marketplace-mcp:${{ steps.version.outputs.value }}
          MCP_EXPECTED_VERSION: ${{ steps.version.outputs.value }}
        run: python3 scripts/e2e_stdio_check_docker.py

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the verified stdio image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.stdio
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The binary runs with packages: write and id-token: write, so it is
      # checked against the v1.8.9 digest (GitHub's asset digest and the
      # release's registry_1.8.9_checksums.txt agree) before it is unpacked.
      - name: Install mcp-publisher
        env:
          PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8
        run: |
          curl -fsSLo mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --help

      - name: Wait for PyPI release metadata before publishing PyPI registry entry
        if: vars.PYPI_PUBLISH == 'true'
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          version = os.environ["EXPECTED_VERSION"]
          url = f"https://pypi.org/pypi/ru-marketplace-mcp/{version}/json"
          deadline = time.monotonic() + 240.0
          while True:
              try:
                  with urllib.request.urlopen(url, timeout=10) as resp:
                      data = json.loads(resp.read().decode("utf-8"))
                  if data.get("info", {}).get("version") == version:
                      print(f"PyPI ru-marketplace-mcp=={version} is live")
                      break
              except (urllib.error.URLError, TimeoutError, json.JSONDecodeError):
                  pass
              if time.monotonic() >= deadline:
                  raise SystemExit(f"Timed out waiting for {url} before MCP Registry publish")
              time.sleep(5)
          PY

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
