name: Release

# Fires when a version tag is pushed (e.g. v1.1.0). Builds a wheel and sdist for
# every workspace package and attaches them to the GitHub Release for that tag.
#
# Deliberately NOT publishing to PyPI: the distribution names (wb-connector and
# friends) are too generic and undecided, so the packages are not on PyPI yet
# (see docs/RELEASE_CHECKLIST.md). This job only builds and attaches artifacts.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # required to create/update the GitHub Release and upload assets

jobs:
  release:
    name: Build packages and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build wheels and sdists for all workspace packages
        # --all-packages builds each of the 15 members (mcp-core plus the 14
        # connectors, including the unified marketplace-connector) into a wheel
        # and an sdist under dist/ — 30 files in all. Verified against the pinned
        # uv version.
        run: uv build --all-packages --out-dir dist

      - name: List built artifacts
        run: ls -la dist

      - name: Verify release artifact set
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          count=$(find dist -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) | wc -l)
          test "$count" -eq 30 || {
            echo "expected 30 wheel/sdist artifacts, found $count" >&2
            exit 1
          }
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          artifacts = [
              p.name for p in Path("dist").iterdir() if p.suffix == ".whl" or p.name.endswith(".tar.gz")
          ]
          wrong = [name for name in artifacts if f"-{version}-" not in name and f"-{version}." not in name]
          if wrong:
              raise SystemExit(f"artifacts with the wrong version: {', '.join(sorted(wrong))}")
          print(f"verified {len(artifacts)} artifacts at version {version}")
          PY

      - name: Attach artifacts to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Two explicit globs, not dist/*: uv writes a one-byte ".gitignore"
          # into its output directory, and a bare wildcard uploads it as a
          # release asset called "default.gitignore" (v1.1.0 shipped with one).
          # Matching only the distribution extensions keeps the asset list to
          # the 30 files a user would actually download — the 15 wheels and 15
          # sdists (.whl + .tar.gz) that `uv build --all-packages` produces.
          files: |
            dist/*.whl
            dist/*.tar.gz
          fail_on_unmatched_files: true
          # Взять написанный от руки текст релиза, если он есть в репозитории.
          # generate_release_notes: true отдаёт список PR'ов от dependabot и
          # затирает то, что автор написал для читателя: так вышло с v1.1.0 и
          # так же вышло с v1.2.0.
          #
          # body задан намеренно как страховка: если заметки не найдены — тело
          # релиза НЕ трогается (автор заполняет его сам, как v1.6.0), вместо
          # этого выводится пометка в лог шага. Пара поведений убрана: старый
          # fallback затирал руками написанный текст релиза строчкой-заглушкой.
          body_path: docs/releases/RELEASE_NOTES_${{ github.ref_name }}.md
          generate_release_notes: false
