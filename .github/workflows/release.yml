name: Release

# Fires when a version tag is pushed (e.g. v1.1.0). Builds a wheel and sdist for
# every workspace package and attaches them to the GitHub Release for that tag.
#
# Deliberately NOT publishing to PyPI: the distribution names (wb-connector and
# friends) are too generic and undecided, so the packages are not on PyPI yet
# (see RELEASE_PROMPT.md). This job only builds and attaches artifacts.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # required to create/update the GitHub Release and upload assets

jobs:
  release:
    name: Build packages and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build wheels and sdists for all workspace packages
        # --all-packages builds each of the 13 members (mcp-core plus the 12
        # connectors, including the unified marketplace-connector) into a wheel
        # and an sdist under dist/ — 26 files in all. Verified against the pinned
        # uv version.
        run: uv build --all-packages --out-dir dist

      - name: List built artifacts
        run: ls -la dist

      - name: Attach artifacts to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Two explicit globs, not dist/*: uv writes a one-byte ".gitignore"
          # into its output directory, and a bare wildcard uploads it as a
          # release asset called "default.gitignore" (v1.1.0 shipped with one).
          # Matching only the distribution extensions keeps the asset list to
          # the 26 files a user would actually download — the 13 wheels and 13
          # sdists (.whl + .tar.gz) that `uv build --all-packages` produces.
          files: |
            dist/*.whl
            dist/*.tar.gz
          fail_on_unmatched_files: true
          # Взять написанный от руки текст релиза, если он есть в репозитории.
          # generate_release_notes: true отдаёт список PR'ов от dependabot и
          # затирает то, что автор написал для читателя: так вышло с v1.1.0 и
          # так же вышло с v1.2.0.
          #
          # body задан намеренно как запасной вариант. Действие сначала пробует
          # body_path и откатывается на body, если файл прочитать не удалось;
          # до октября 2025 такой откат отсутствовал и отсутствующий файл ронял
          # шаг с ENOENT. Пара body_path + body ведёт себя правильно в обоих
          # случаях, поэтому забытый файл заметок не сорвёт релиз.
          body_path: RELEASE_NOTES_${{ github.ref_name }}.md
          body: |
            Заметки к ${{ github.ref_name }} — см. CHANGELOG.md.
          generate_release_notes: false
