[project]
name = "compare-connector"
version = "1.2.1"
description = "Cross-marketplace price comparison MCP server — queries every configured marketplace at once"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Vladimir-Human", email = "39053957+Vladimir-Human@users.noreply.github.com" }]
dependencies = [
    "mcp-core",
    "wb-connector",
    "detmir-connector",
    "yandex-connector",
    "fastmcp>=3.4.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
# Tier-2 sources pull curl_cffi and/or playwright, which not every user wants.
ozon = ["ozon-connector"]
avito = ["avito-connector"]
taobao = ["taobao-connector"]
megamarket = ["megamarket-connector"]
lamoda = ["lamoda-connector"]
dns = ["dns-connector"]
citilink = ["citilink-connector"]
all = [
    "ozon-connector",
    "avito-connector",
    "taobao-connector",
    "megamarket-connector",
    "lamoda-connector",
    "dns-connector",
    "citilink-connector",
]

[project.scripts]
compare-mcp = "compare_connector.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compare_connector"]

[tool.uv.sources]
mcp-core = { workspace = true }
wb-connector = { workspace = true }
detmir-connector = { workspace = true }
yandex-connector = { workspace = true }
ozon-connector = { workspace = true }
avito-connector = { workspace = true }
taobao-connector = { workspace = true }
megamarket-connector = { workspace = true }
lamoda-connector = { workspace = true }
dns-connector = { workspace = true }
citilink-connector = { workspace = true }
