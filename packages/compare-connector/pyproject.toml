[project]
name = "compare-connector"
version = "1.1.0"
description = "Cross-marketplace price comparison MCP server — queries every configured Russian marketplace at once"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp-core",
    "wb-connector",
    "detmir-connector",
    "yandex-connector",
    "fastmcp>=3.4.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
# Ozon needs curl_cffi + playwright, which not every user wants installed.
ozon = ["ozon-connector"]

[project.scripts]
compare-mcp = "compare_connector.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compare_connector"]

[tool.uv.sources]
mcp-core = { workspace = true }
wb-connector = { workspace = true }
detmir-connector = { workspace = true }
yandex-connector = { workspace = true }
ozon-connector = { workspace = true }
