[project]
name = "taobao-connector"
version = "1.2.0"
description = "Taobao MCP connector — search and item cards rendered in the operator's own Chrome over CDP"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Vladimir-Human", email = "39053957+Vladimir-Human@users.noreply.github.com" }]
dependencies = [
    "mcp-core",
    "fastmcp>=3.4.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "playwright>=1.40",
]

[project.scripts]
taobao-mcp = "taobao_connector.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taobao_connector"]

[tool.uv.sources]
mcp-core = { workspace = true }
