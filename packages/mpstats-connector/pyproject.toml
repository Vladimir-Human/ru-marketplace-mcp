[project]
name = "mpstats-connector"
version = "0.1.0"
description = "MPStats MCP connector — sales/stock analytics for Ozon/WB items via plugin.mpstats.io"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp-core",
    "fastmcp>=3.4.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.scripts]
mpstats-mcp = "mpstats_connector.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mpstats_connector"]

[tool.uv.sources]
mcp-core = { workspace = true }