[project]
name = "lamoda-connector"
version = "1.2.0"
description = "Lamoda MCP connector — GraphQL SKU enrichment plus CDP-backed search"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Vladimir-Human", email = "39053957+Vladimir-Human@users.noreply.github.com" }]
dependencies = [
    "mcp-core",
    "fastmcp>=3.4.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "playwright>=1.40",
]

[project.scripts]
lamoda-mcp = "lamoda_connector.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lamoda_connector"]

[tool.uv.sources]
mcp-core = { workspace = true }
