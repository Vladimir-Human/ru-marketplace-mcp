<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Запрос отклонен</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f4f4f1;color:#111;font:14px/1.45 Arial,Helvetica,sans-serif;display:grid;place-items:center;padding:24px}.wrap{width:min(100%,520px);text-align:center}.mark{width:184px;height:184px;background:#000;margin:0 auto 28px;display:grid;place-items:center}.mark svg{width:132px;height:auto}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#6b6b66;margin:0 0 8px}h1{font-size:28px;line-height:1.1;margin:0 0 12px}.lead{margin:0 auto 24px;max-width:390px;color:#4f4f49}.meta{display:grid;gap:8px;text-align:left;margin:0 auto 22px;padding:16px;border:1px solid #d8d8d2;background:#fff}.row{display:flex;gap:12px;justify-content:space-between;border-bottom:1px solid #eee;padding-bottom:8px}.row:last-child{border:0;padding-bottom:0}.k{color:#686862}.v{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-align:right;word-break:break-all}.btn{appearance:none;border:0;background:#111;color:#fff;font:700 13px Arial,Helvetica,sans-serif;padding:12px 18px;cursor:pointer}.btn:focus{outline:2px solid #777;outline-offset:3px}.hint{margin:14px 0 0;color:#686862;font-size:12px}@media(max-width:420px){.mark{width:148px;height:148px}.mark svg{width:108px}h1{font-size:24px}.row{display:block}.v{text-align:left;display:block;margin-top:2px}}
</style></head><body><main class="wrap"><div class="mark" aria-hidden="true"><svg></svg></div><p class="eyebrow">Проверка безопасности</p><h1>Запрос отклонен</h1><p class="lead">Если это ошибка, отправьте в поддержку данные ниже.</p><section class="meta" aria-label="Данные запроса"><div class="row"><span class="k">Время</span><span class="v" id="REQUEST-DATE">2026-11-16 03:27:28 +0000</span></div><div class="row"><span class="k">IP</span><span class="v" id="REQUEST-IP">203.0.113.7</span></div><div class="row"><span class="k">ID запроса</span><span class="v" id="REQUEST-ID">TESTREQUEST1</span></div><div class="row"><span class="k">Источник</span><span class="v" id="ORIGIN-ID">https://www.lamoda.ru</span></div></section><button class="btn" onclick="copy()">Скопировать отчет</button><p class="hint" id="COPIED" role="status"></p></main><script>
function copy(){var r={report:{datetime:val("REQUEST-DATE"),ip:val("REQUEST-IP"),id:val("REQUEST-ID"),origin:val("ORIGIN-ID")}},s=JSON.stringify(r);if(navigator.clipboard)navigator.clipboard.writeText(s).then(done);else{document.oncopy=function(e){e.clipboardData.setData("text",s);e.preventDefault();done()};document.execCommand("copy")}}function val(i){return document.getElementById(i).textContent}function done(){document.getElementById("COPIED").textContent="Отчет скопирован."}document.addEventListener("DOMContentLoaded",function(){document.getElementById("ORIGIN-ID").textContent=location.protocol+"//"+location.host});
</script>
</body></html>
