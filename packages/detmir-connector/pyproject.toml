[project]
name = "detmir-connector"
version = "1.1.0"
description = "Detsky Mir MCP connector — anonymous public JSON API (cards, category listings, search)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp-core",
    "fastmcp>=3.4.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.scripts]
detmir-mcp = "detmir_connector.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detmir_connector"]

[tool.uv.sources]
mcp-core = { workspace = true }
