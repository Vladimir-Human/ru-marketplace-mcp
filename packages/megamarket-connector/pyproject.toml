[project]
name = "megamarket-connector"
version = "1.4.0"
description = "Megamarket MCP connector — mobile JSON API fetched inside the operator's Chrome over CDP (ServicePipe)"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Vladimir-Human", email = "39053957+Vladimir-Human@users.noreply.github.com" }]
dependencies = [
    # Pinned, not floating: the name `mcp-core` on PyPI belongs to an
    # unrelated project. Unpinned, a wheel installed straight from a GitHub
    # Release resolves to that stranger's package and the server dies on
    # import. A pin turns a silent wrong install into a loud resolve failure.
    "mcp-core==1.4.0",
    "fastmcp>=3.4.5",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "playwright>=1.40",
]

[project.scripts]
megamarket-mcp = "megamarket_connector.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/megamarket_connector"]

[tool.uv.sources]
mcp-core = { workspace = true }
