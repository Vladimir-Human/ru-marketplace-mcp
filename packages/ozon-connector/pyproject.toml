[project]
name = "ozon-connector"
version = "1.3.0"
description = "Ozon MCP connector — two-tier transport (TLS impersonation + authenticated Chrome CDP)"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Vladimir-Human", email = "39053957+Vladimir-Human@users.noreply.github.com" }]
dependencies = [
    # Pinned, not floating: the name `mcp-core` on PyPI belongs to an
    # unrelated project. Unpinned, a wheel installed straight from a GitHub
    # Release resolves to that stranger's package and the server dies on
    # import. A pin turns a silent wrong install into a loud resolve failure.
    "mcp-core==1.3.0",
    "fastmcp>=3.4.5",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "curl-cffi>=0.7",
    "playwright>=1.47",
]

[project.scripts]
ozon-mcp = "ozon_connector.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ozon_connector"]

[tool.uv.sources]
mcp-core = { workspace = true }
