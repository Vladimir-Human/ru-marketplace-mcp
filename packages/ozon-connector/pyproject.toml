[project]
name = "ozon-connector"
version = "1.1.0"
description = "Ozon MCP connector — two-tier transport (TLS impersonation + authenticated Chrome CDP)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp-core",
    "fastmcp>=3.4.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "curl-cffi>=0.7",
    "playwright>=1.47",
]

[project.scripts]
ozon-mcp = "ozon_connector.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ozon_connector"]

[tool.uv.sources]
mcp-core = { workspace = true }
