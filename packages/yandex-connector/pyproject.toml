[project]
name = "yandex-connector"
version = "1.2.0"
description = "Yandex Market MCP connector — SSR state extraction (search, cards, reviews)"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Vladimir-Human", email = "39053957+Vladimir-Human@users.noreply.github.com" }]
dependencies = [
    "mcp-core",
    "fastmcp>=3.4.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.scripts]
yandex-mcp = "yandex_connector.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yandex_connector"]

[tool.uv.sources]
mcp-core = { workspace = true }
