# Run the connectors as HTTP MCP servers in containers.
#
# Each service is the SAME image with a different command, one per marketplace,
# each on its own port. HTTP is the only transport that makes sense here: a
# detached container has no MCP client attached to its stdin/stdout, so stdio
# would just sit idle. (If you truly want stdio in a container, a client has to
# `docker exec -i` into it and speak JSON-RPC over that pipe — niche, and not
# what this file sets up.)
#
# SECURITY: every port below is published as "127.0.0.1:PORT:PORT", so it is
# reachable only from the host, not the LAN. These servers have NO built-in
# auth — the tools are read-only, but an open port is still an unauthenticated
# scraper anyone who can reach it may drive. To expose one deliberately, put an
# authenticating reverse proxy in front and point IT at the published port;
# do not change these to 0.0.0.0:PORT.
#
# No `healthcheck:` on these services on purpose — see the HEALTHCHECK note in
# the Dockerfile. The only HTTP route is FastMCP's streamable-HTTP /mcp
# endpoint, which does not answer a bare GET with a plain 200, so any check we
# could write here would flap. A real /healthz route in mcp-core is the fix; it
# is a code change in packages/, out of scope for this file.

services:
  # START HERE. marketplace-mcp is the unified server: every source's tools in
  # one process, so a single client connection reaches all of them. Most users
  # want exactly this and can ignore the per-source services below (those exist
  # for isolating one marketplace on its own port). It runs its fetches
  # in-process, so it inherits the tier-2 caveats of every CDP source it wraps —
  # uncomment CHROME_CDP_HOST plus the chrome sidecar to unlock those sources.
  marketplace-mcp:
    build: .
    image: ru-marketplace-mcp:1.2.1
    command: ["marketplace-mcp"]
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0 # inside the container; the host binding below is what gates access
      MCP_HTTP_PORT: 8000
      MCP_HTTP_PATH: /mcp
      # Chrome sidecar on this compose network:
      # CHROME_CDP_HOST: chrome
      # CHROME_CDP_PORT: "9222"
    ports:
      - "127.0.0.1:8005:8000"
    restart: unless-stopped

  wb:
    build: .
    image: ru-marketplace-mcp:1.2.1
    command: ["wb-mcp"]
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0 # inside the container; the host binding below is what gates access
      MCP_HTTP_PORT: 8000
      MCP_HTTP_PATH: /mcp
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  yandex:
    build: .
    image: ru-marketplace-mcp:1.2.1
    command: ["yandex-mcp"]
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 8000
      MCP_HTTP_PATH: /mcp
    ports:
      - "127.0.0.1:8001:8000"
    restart: unless-stopped

  detmir:
    build: .
    image: ru-marketplace-mcp:1.2.1
    command: ["detmir-mcp"]
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 8000
      MCP_HTTP_PATH: /mcp
      DETMIR_REGION: RU-MOW
    ports:
      - "127.0.0.1:8002:8000"
    restart: unless-stopped

  # Ozon is included for completeness but comes with two honest caveats; see
  # docs/DEPLOYMENT.md for the full story.
  #
  # 1. TIER 1 (anonymous HTTP) needs a Russian-friendly IP. From a datacenter
  #    container it is usually blocked outright, so tools will report Ozon as
  #    unavailable. Route through a Russian residential proxy to change that:
  #    set OZON_PROXY or the standard HTTPS_PROXY.
  # 2. TIER 2 (authenticated Chrome over the DevTools Protocol) needs a Chrome
  #    the client can reach. The CDP dial target is configurable:
  #    CHROME_CDP_HOST (default 127.0.0.1) and CHROME_CDP_PORT (default 9222).
  #    From inside a container, point the host at a Chrome sidecar on this
  #    network or at host.docker.internal — the commented variant below shows
  #    the sidecar route. Exposing a CDP debug port grants full control of that
  #    browser profile, so use a dedicated scraping profile only.
  ozon:
    build: .
    image: ru-marketplace-mcp:1.2.1
    command: ["ozon-mcp"]
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 8000
      MCP_HTTP_PATH: /mcp
      # Chrome sidecar on this compose network:
      # CHROME_CDP_HOST: chrome
      # CHROME_CDP_PORT: "9222"
      # A Russian residential proxy is what makes tier 1 work from a datacenter.
      # OZON_PROXY: http://user:pass@ru-residential-proxy:port
    ports:
      - "127.0.0.1:8003:8000"
    restart: unless-stopped
    # --- Tier-2 alternatives, pick one ---
    # a) Chrome sidecar (recommended): add the service below and set
    #    CHROME_CDP_HOST=chrome above. Log into Ozon once in that profile; the
    #    named volume keeps the session across rebuilds.
    # b) host.docker.internal: CHROME_CDP_HOST=host.docker.internal reaches the
    #    host's own Chrome (start it with scripts/start_chrome_cdp.sh first).
    # c) Host networking (Linux only): network_mode: host makes 127.0.0.1:9222
    #    reachable directly; drop `ports:` and set MCP_HTTP_HOST=127.0.0.1.

  # --- CDP-only sources -----------------------------------------------------
  # avito, taobao, megamarket, lamoda, dns and citilink have no anonymous HTTP
  # tier: every tool goes through authenticated Chrome over the DevTools
  # Protocol, so each NEEDS a reachable Chrome. Wire them exactly like ozon's
  # tier 2 — uncomment CHROME_CDP_HOST here and the chrome sidecar below (or use
  # host.docker.internal / host networking per the ozon notes). Without that the
  # servers still start and register tools, but every call reports the source
  # unavailable. They have no OZON_PROXY equivalent: the proxy, if any, belongs
  # in the Chrome profile the sidecar drives, not on these services.
  avito:
    build: .
    image: ru-marketplace-mcp:1.2.1
    command: ["avito-mcp"]
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 8000
      MCP_HTTP_PATH: /mcp
      # CHROME_CDP_HOST: chrome
      # CHROME_CDP_PORT: "9222"
    ports:
      - "127.0.0.1:8006:8000"
    restart: unless-stopped

  taobao:
    build: .
    image: ru-marketplace-mcp:1.2.1
    command: ["taobao-mcp"]
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 8000
      MCP_HTTP_PATH: /mcp
      # CHROME_CDP_HOST: chrome
      # CHROME_CDP_PORT: "9222"
    ports:
      - "127.0.0.1:8007:8000"
    restart: unless-stopped

  megamarket:
    build: .
    image: ru-marketplace-mcp:1.2.1
    command: ["megamarket-mcp"]
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 8000
      MCP_HTTP_PATH: /mcp
      # CHROME_CDP_HOST: chrome
      # CHROME_CDP_PORT: "9222"
    ports:
      - "127.0.0.1:8008:8000"
    restart: unless-stopped

  lamoda:
    build: .
    image: ru-marketplace-mcp:1.2.1
    command: ["lamoda-mcp"]
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 8000
      MCP_HTTP_PATH: /mcp
      # CHROME_CDP_HOST: chrome
      # CHROME_CDP_PORT: "9222"
    ports:
      - "127.0.0.1:8009:8000"
    restart: unless-stopped

  dns:
    build: .
    image: ru-marketplace-mcp:1.2.1
    command: ["dns-mcp"]
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 8000
      MCP_HTTP_PATH: /mcp
      # CHROME_CDP_HOST: chrome
      # CHROME_CDP_PORT: "9222"
    ports:
      - "127.0.0.1:8010:8000"
    restart: unless-stopped

  citilink:
    build: .
    image: ru-marketplace-mcp:1.2.1
    command: ["citilink-mcp"]
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 8000
      MCP_HTTP_PATH: /mcp
      # CHROME_CDP_HOST: chrome
      # CHROME_CDP_PORT: "9222"
    ports:
      - "127.0.0.1:8011:8000"
    restart: unless-stopped

  # --- Optional Chrome sidecar for tier-2 sources. Uncomment to enable. ---
  # chrome:
  #   image: zenika/alpine-chrome:latest
  #   command:
  #     - --no-sandbox
  #     - --remote-debugging-port=9222
  #     - --remote-debugging-address=0.0.0.0
  #     - --user-data-dir=/profile
  #     - about:blank
  #   volumes:
  #     - chrome-scraping:/profile
  #   restart: unless-stopped
  #   # No published port: only other services on this network can drive it.

  # compare-mcp fans a query out across all marketplaces at once. It runs its
  # own fetches in-process (it does not call the services above), so one
  # container is enough; Ozon inside it inherits the same two caveats.
  compare:
    build: .
    image: ru-marketplace-mcp:1.2.1
    command: ["compare-mcp"]
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 8000
      MCP_HTTP_PATH: /mcp
    ports:
      - "127.0.0.1:8004:8000"
    restart: unless-stopped

# Named volume for the optional Chrome sidecar's scraping profile, so the Ozon
# login survives container rebuilds. Uncomment together with the chrome service.
# volumes:
#   chrome-scraping:
